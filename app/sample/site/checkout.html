<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lumen – Checkout</title>
  <style>
    body { margin: 0; font: 14px/1.5 -apple-system, 'Inter', sans-serif; color: #1b2147; background: #f5f6fb; }
    .wrap { max-width: 460px; margin: 32px auto; padding: 0 24px; }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
    h1 { font-size: 18px; margin: 0; }
    header span { font-size: 12px; color: #6b7299; }
    label { font-size: 12px; color: #6b7299; }
    input { width: 100%; box-sizing: border-box; padding: 10px; margin: 4px 0 12px; border: 1px solid #d5d9ea; border-radius: 6px; font: inherit; }
    .summary { background: #fff; border: 1px solid #d5d9ea; border-radius: 6px; }
    .row { display: flex; justify-content: space-between; padding: 6px 10px; border-bottom: 1px dashed #e3e6f2; }
    .row:last-child { border: none; font-weight: 600; }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 8px; }
    .actions a { color: #2b3380; flex: 1; }
    button { padding: 8px 16px; border-radius: 6px; border: 1px solid #d5d9ea; background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    #buy-now { background: #1b2147; color: #fff; border-color: #1b2147; }
    #result { margin-top: 18px; color: #1f8a55; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <header><h1>Lumen</h1><span>Checkout</span></header>
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" />
    <div class="summary">
      <div class="row"><span>Desk lamp</span><span>$48.00</span></div>
      <div class="row"><span>Linen shade</span><span>$22.00</span></div>
      <div class="row"><span>Payment</span><span>Visa ending 4242</span></div>
      <div class="row"><span>Total</span><span>$70.00</span></div>
    </div>
    <div class="actions">
      <a href="#">Continue shopping</a>
      <button>Apply coupon</button>
      <button id="buy-now">Place order</button>
    </div>
    <div id="result" hidden>Order confirmed</div>
  </div>
  <script>
    document.getElementById('buy-now').addEventListener('click', () => {
      document.getElementById('result').hidden = false;
    });
  </script>
</body>
</html>
